<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭空间 · 设计提案</title><style>
*{box-sizing:border-box}body{margin:0;background:#ececea;color:#252b2a;font-family:Inter,"Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}header{padding:25px 5vw;border-bottom:1px solid #d7d8d4;display:flex;justify-content:space-between;align-items:center;background:#fafaf8}header strong{font-size:19px}header small{color:#757b76}nav{display:flex;gap:8px;flex-wrap:wrap;padding:24px 5vw 0}nav button{background:transparent;border:1px solid #bfc5bf;border-radius:30px;padding:12px 22px}nav button.active{background:#253c34;color:white;border-color:#253c34}.intro{padding:24px 5vw 28px;display:flex;justify-content:space-between;align-items:end}.intro h1{font-size:32px;margin:0 0 10px;letter-spacing:-1px}.intro p{color:#727a74;margin:0;font-size:14px;line-height:1.8}.swatches{display:flex;gap:6px}.swatches i{width:26px;height:26px;border-radius:50%;background:var(--c)}.stage{padding:0 5vw 50px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}.label{font-size:11px;letter-spacing:3px;color:#6e766f;margin-bottom:12px}.screen{background:var(--bg);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 15px 40px #18281e0b;min-height:675px}.warm{--bg:#f8f5ed;--card:#fffdf7;--ink:#343f32;--mute:#939384;--accent:#55714b;--line:#e5e4d8;--soft:#ebeeda;--second:#edc993}.blue{--bg:#f4f7fc;--card:#fff;--ink:#213550;--mute:#8291a8;--accent:#436ad3;--line:#e4eaf4;--soft:#e8eefc;--second:#bcd1f5}.dark{--bg:#172925;--card:#203831;--ink:#f1efdf;--mute:#97aaa1;--accent:#d0e4a2;--line:#365047;--soft:#2b4538;--second:#d6ac7d}.top{padding:28px 32px;display:flex;justify-content:space-between;align-items:center;font-size:13px;border-bottom:1px solid var(--line)}.brand{font-weight:700;letter-spacing:2px;font-size:19px}.top .links{color:var(--mute);display:flex;gap:25px}.avatar{width:32px;height:32px;border-radius:50%;background:var(--second);display:grid;place-items:center;color:#4a5140;font-size:13px}.content{padding:30px 32px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--mute)}.greet{display:flex;justify-content:space-between;align-items:center;margin:12px 0 25px}.greet h2{font-size:29px;font-weight:500;margin:0}.greet p{font-size:12px;color:var(--mute);margin:10px 0 0}.pill{border:1px solid var(--line);border-radius:25px;padding:9px 13px;font-size:11px}.hero{background:var(--soft);border-radius:14px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;padding:24px;margin-bottom:24px;min-height:165px}.hero h3{font-size:23px;font-weight:500;margin:10px 0}.hero p{font-size:12px;color:var(--mute);line-height:1.8;margin:0}.art{width:155px;height:115px;position:relative;flex-shrink:0}.sun{position:absolute;right:10px;top:0;width:55px;height:55px;border-radius:50%;background:var(--second)}.house{position:absolute;width:87px;height:66px;background:var(--card);bottom:4px;left:20px;border-radius:3px}.roof{position:absolute;left:9px;bottom:69px;border-left:55px solid transparent;border-right:55px solid transparent;border-bottom:44px solid var(--accent)}.door{position:absolute;background:var(--second);height:34px;width:22px;bottom:0;left:32px;border-radius:12px 12px 0 0}.tree{position:absolute;right:4px;bottom:0;width:35px;height:67px;background:var(--accent);border-radius:70% 70% 35% 35%;opacity:.7}.columns{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.heading h3{font-size:15px;margin:0;font-weight:600}.heading span{font-size:11px;color:var(--mute)}.task{display:flex;gap:12px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}.check{width:17px;height:17px;border:1px solid var(--mute);border-radius:5px;flex-shrink:0}.done .check{background:var(--accent);border-color:var(--accent)}.task strong{font-size:12px;font-weight:500;display:block}.task small{font-size:10px;color:var(--mute);display:block;margin-top:6px}.done strong{text-decoration:line-through;color:var(--mute)}.tag{margin-left:auto;font-size:9px;background:var(--soft);padding:5px 8px;border-radius:6px;white-space:nowrap}.eventdate{font-size:42px;font-weight:300;margin:18px 0 4px}.eventdate small{font-size:12px;color:var(--mute)}.note{font-size:12px;line-height:1.8}.people{display:flex;gap:5px;margin-top:17px}.people .avatar{width:26px;height:26px;font-size:10px}.foot{display:flex;gap:13px;margin-top:19px;color:var(--mute);font-size:10px;align-items:center}.foot::before{content:'';width:5px;height:5px;background:var(--accent);border-radius:50%}.login{padding:25px;display:flex;flex-direction:column;min-height:675px}.status{display:flex;justify-content:space-between;font-size:11px;margin-bottom:38px}.login .art{margin:0 auto 22px;transform:scale(1.1)}.login h2{font-size:30px;font-weight:500;letter-spacing:-1px;margin:18px 0 10px;line-height:1.35}.login p{font-size:12px;color:var(--mute);line-height:1.9;margin:0 0 28px}.field{border-bottom:1px solid var(--line);padding:16px 0;font-size:12px;color:var(--mute)}.login button{border:0;border-radius:10px;background:var(--accent);color:var(--bg);padding:16px;width:100%;margin-top:24px;font-size:13px}.login .legal{font-size:9px;text-align:center;margin-top:auto;padding-top:35px;line-height:1.8}.dark .hero{border:1px solid var(--line);background:linear-gradient(115deg,#2b4538,#24382e)}.dark .brand{font-family:Georgia,serif}.blue .hero{min-height:130px}.week{display:flex;gap:7px;margin-bottom:24px}.day{flex:1;text-align:center;padding:12px 3px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:15px}.day small{display:block;color:var(--mute);font-size:9px;margin-bottom:8px}.day.chosen{background:var(--accent);color:var(--bg)}.day.chosen small{color:var(--bg)}.dark .hero h3{font-size:28px}.caption{margin-top:12px;color:#7c827d;font-size:11px;line-height:1.7}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#253c34;color:#fff;padding:14px 22px;border-radius:12px;font-size:13px;display:none}@media(min-width:1500px){.stage,.intro,nav{max-width:1450px;margin:auto}}@media(max-width:1000px){.stage{grid-template-columns:1fr}.phonewrap{max-width:340px;margin:10px auto;width:100%}.top .links{display:none}.intro{align-items:start}.swatches{display:none}}@media(max-width:550px){header small{display:none}.intro h1{font-size:25px}.content{padding:23px 18px}.top{padding:24px 18px}.greet h2{font-size:23px}.greet .pill{display:none}.columns{grid-template-columns:1fr}.hero{padding:18px}.hero .art{transform:scale(.8);width:110px}.hero h3{font-size:19px}nav button{padding:10px 13px;font-size:12px}.screen{min-height:0}.login{min-height:650px}}
</style></head><body><header><strong>家庭空间 / 视觉提案</strong><small>三种方向 · 示例数据 · 尚未接入业务</small></header><nav><button class="active" onclick="show(0)">01 · 日光小院</button><button onclick="show(1)">02 · 有序日常</button><button onclick="show(2)">03 · 暮色客厅</button></nav><section class="intro"><div><h1 id="title"></h1><p id="desc"></p></div><div class="swatches" id="swatches"></div></section><main class="stage" id="stage"></main><div id="toast">这是视觉设计稿，选定方向后再接入登录和业务功能。</div><script>
const proposals=[{theme:'warm',title:'01 / 日光小院',desc:'奶油白 × 橄榄绿 × 暖杏色。轻柔、有生活气息，让家庭空间像一本日常手账。',brand:'小院 · 家庭空间',greet:'把日子，过在一起。',hero:'平凡的今天，也值得记录',sub:'一顿晚饭，一张合照，一件小事。<br>属于我们的生活，在这里慢慢收藏。',login:'家人的日常，<br>都在这里。',colors:['#f8f5ed','#55714b','#edc993']},{theme:'blue',title:'02 / 有序日常',desc:'云白 × 晴空蓝。信息清晰、日程优先，适合把任务和家庭安排放在第一位。',brand:'一起 · 家庭日程',greet:'早上好，今天有个好安排。',hero:'这个周末，一起去公园',sub:'周六 09:30 · 带上野餐垫和好心情<br>还有 3 位家人将会参加。',login:'生活有序，<br>陪伴有时。',colors:['#f4f7fc','#436ad3','#bcd1f5']},{theme:'dark',title:'03 / 暮色客厅',desc:'深松绿 × 月光米 × 黄铜色。安静、有质感，强调家庭相聚与私密空间的归属感。',brand:'归处 / 家庭私享空间',greet:'忙碌之后，回到家人身边。',hero:'家，是每一天的归处',sub:'留一些时间，给最重要的人。<br>把彼此的牵挂，放在同一个地方。',login:'灯亮着，<br>家就在。',colors:['#172925','#d0e4a2','#d6ac7d']}];
const art='<div class="art" aria-hidden="true"><div class="sun"></div><div class="roof"></div><div class="house"><div class="door"></div></div><div class="tree"></div></div>';
function show(index){const p=proposals[index];document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===index));document.getElementById('title').textContent=p.title;document.getElementById('desc').textContent=p.desc;document.getElementById('swatches').innerHTML=p.colors.map(c=>`<i style="--c:${c}"></i>`).join('');document.getElementById('stage').innerHTML=`<section><div class="label">家庭首页 · 桌面布局</div><div class="screen ${p.theme}"><div class="top"><span class="brand">${p.brand}</span><div class="links"><span style="color:var(--ink)">首页</span><span>家庭安排</span><span>时光相册</span></div><div class="avatar">林</div></div><div class="content"><div class="eyebrow">10 月 03 日 · 星期六 · 晴</div><div class="greet"><div><h2>${p.greet}</h2><p>林家的小天地 · 4 位家人，彼此相伴</p></div><span class="pill">☀ 24° 适合出门走走</span></div>${index===1?'<div class="week">'+['一','二','三','四','五','六','日'].map((d,i)=>`<div class="day ${i===5?'chosen':''}"><small>周${d}</small>${[28,29,30,1,2,3,4][i]}</div>`).join('')+'</div>':''}<div class="hero"><div><div class="eyebrow">${index===1?'下一场家庭活动':'我们的小日子'}</div><h3>${p.hero}</h3><p>${p.sub}</p></div>${art}</div><div class="columns"><div class="card"><div class="heading"><h3>今天，一起完成</h3><span>1 / 3 已完成</span></div><div class="task"><span class="check"></span><div><strong>买一些新鲜蔬菜</strong><small>爸爸 · 今天 17:30 前</small></div><span class="tag">待开始</span></div><div class="task"><span class="check"></span><div><strong>给阳台的绿植浇水</strong><small>小林 · 今天完成</small></div><span class="tag">进行中</span></div><div class="task done"><span class="check"></span><div><strong>预约周末的家庭聚餐</strong><small>妈妈 · 已完成</small></div></div></div><div class="card"><div class="heading"><h3>值得期待的日子</h3><span>家庭日历 ↗</span></div><div class="eventdate">12 <small>天后</small></div><div class="note">奶奶的生日<br><span style="color:var(--mute);font-size:11px">10 月 15 日 · 每年的重要约定</span></div><div class="people"><div class="avatar">爸</div><div class="avatar">妈</div><div class="avatar">林</div><span style="font-size:10px;color:var(--mute);padding:7px">一起准备一个小惊喜</span></div></div></div><div class="foot">家庭公告：周末晚饭六点开饭，记得早点回家。</div></div></div><div class="caption">设计重点：${index===0?'温暖插画、低对比色彩、舒展的卡片与留白。':index===1?'一周日程直接呈现，任务层级明确，操作路径简短。':'深色层次、克制的亮色点缀，营造安静的家庭氛围。'}</div></section><section class="phonewrap"><div class="label">登录页 · 手机布局</div><div class="screen login ${p.theme}"><div class="status"><span>9:41</span><span>▰ ▰ ●</span></div>${art}<div class="eyebrow">${p.brand}</div><h2>${p.login}</h2><p>为家人留一方小天地。<br>记录生活，也珍藏每一次陪伴。</p><div class="field">请输入手机号</div><div class="field">请输入账号密码</div><button onclick="preview()">进入我们的家 &nbsp; →</button><div class="legal">仅受邀家庭成员可加入<br>你的家庭资料，仅与家人分享</div></div><div class="caption">登录表单为视觉示意，不采集账号密码。</div></section>`;}
function preview(){const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',2600)}show(0);
</script></body></html>

services:
  nacos:
    image: nacos/nacos-server:v2.4.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?请在 .env 中配置 Nacos 鉴权令牌}
    ports:
      - "8848:8848"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置数据库 root 密码}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 .env 中配置业务账号密码}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: family
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中配置 RabbitMQ 密码}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  family-gateway:
    build:
      context: ..
      dockerfile: backend/family-gateway/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?请在 .env 中配置 JWT 密钥}
      FAMILY_RATE_LIMIT_ENABLED: ${FAMILY_RATE_LIMIT_ENABLED:-true}
      REDIS_HOST: redis
      FAMILY_RATE_LIMIT_REPLENISH: ${FAMILY_RATE_LIMIT_REPLENISH:-20}
      FAMILY_RATE_LIMIT_BURST: ${FAMILY_RATE_LIMIT_BURST:-40}
    ports:
      - "8080:8080"
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq

  family-user-svc:
    build:
      context: ..
      dockerfile: backend/family-user-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_USER_DB_URL: jdbc:mysql://mysql:3306/family_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      FAMILY_USER_DB_USERNAME: family_app
      FAMILY_USER_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      FAMILY_BOOTSTRAP_ENABLED: "true"
      FAMILY_BOOTSTRAP_HOUSEHOLD_NAME: ${FAMILY_BOOTSTRAP_HOUSEHOLD_NAME:-}
      FAMILY_BOOTSTRAP_ADMIN_PHONE: ${FAMILY_BOOTSTRAP_ADMIN_PHONE:-}
      FAMILY_BOOTSTRAP_ADMIN_PASSWORD: ${FAMILY_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      - nacos
      - mysql

  family-content-svc:
    build:
      context: ..
      dockerfile: backend/family-content-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_CONTENT_DB_URL: jdbc:mysql://mysql:3306/family_content?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      FAMILY_CONTENT_DB_USERNAME: family_app
      FAMILY_CONTENT_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      FAMILY_MESSAGING_ENABLED: ${FAMILY_MESSAGING_ENABLED:-true}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq

  family-file-svc:
    build:
      context: ..
      dockerfile: backend/family-file-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_FILE_DB_URL: jdbc:mysql://mysql:3306/family_file?serverTimezone=Asia/Shanghai
      FAMILY_FILE_DB_USERNAME: family_app
      FAMILY_FILE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      FAMILY_MESSAGING_ENABLED: ${FAMILY_MESSAGING_ENABLED:-true}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      FAMILY_FILE_STORAGE_TYPE: ${FAMILY_FILE_STORAGE_TYPE:-local}
      FAMILY_FILE_ROOT: /data/files
      FAMILY_S3_ENDPOINT: ${FAMILY_S3_ENDPOINT:-}
      FAMILY_S3_REGION: ${FAMILY_S3_REGION:-us-east-1}
      FAMILY_S3_BUCKET: ${FAMILY_S3_BUCKET:-}
      FAMILY_S3_ACCESS_KEY: ${FAMILY_S3_ACCESS_KEY:-}
      FAMILY_S3_SECRET_KEY: ${FAMILY_S3_SECRET_KEY:-}
    volumes:
      - file-data:/data/files
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq

  family-archive-svc:
    build:
      context: ..
      dockerfile: backend/family-archive-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_ARCHIVE_DB_URL: jdbc:mysql://mysql:3306/family_archive?serverTimezone=Asia/Shanghai
      FAMILY_ARCHIVE_DB_USERNAME: family_app
      FAMILY_ARCHIVE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      FAMILY_ARCHIVE_KEY: ${FAMILY_ARCHIVE_KEY:?请在 .env 中配置 32 字节档案密钥 Base64}
    depends_on:
      - nacos
      - mysql

  family-im-svc:
    build:
      context: ..
      dockerfile: backend/family-im-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_IM_DB_URL: jdbc:mysql://mysql:3306/family_im?serverTimezone=Asia/Shanghai
      FAMILY_IM_DB_USERNAME: family_app
      FAMILY_IM_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      FAMILY_MESSAGING_ENABLED: ${FAMILY_MESSAGING_ENABLED:-true}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq

  family-media-svc:
    build:
      context: ..
      dockerfile: backend/family-media-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_MEDIA_DB_URL: jdbc:mysql://mysql:3306/family_media?serverTimezone=Asia/Shanghai
      FAMILY_MEDIA_DB_USERNAME: family_app
      FAMILY_MEDIA_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      # 多副本部署时信令与票据必须走 Redis，否则两个实例上的家人互相收不到呼叫。
      FAMILY_MESSAGING_ENABLED: ${FAMILY_MESSAGING_ENABLED:-true}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?}
      FAMILY_TURN_SECRET: ${FAMILY_TURN_SECRET:?请在 .env 中配置 TURN 静态密钥}
      FAMILY_TURN_URLS: ${FAMILY_TURN_URLS:-turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp}
      FAMILY_STUN_URLS: ${FAMILY_STUN_URLS:-stun:127.0.0.1:3478}
      # LiveKit SFU：总开关默认关闭；开启前必须在 .env 配齐 key/secret/public-url。
      FAMILY_LIVEKIT_ENABLED: ${FAMILY_LIVEKIT_ENABLED:-false}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-http://127.0.0.1:7880}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-family-}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-3600}
      LIVEKIT_MAX_PARTICIPANTS: ${LIVEKIT_MAX_PARTICIPANTS:-20}
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq
      - coturn

  family-ai-svc:
    build:
      context: ..
      dockerfile: backend/family-ai-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_AI_DB_URL: jdbc:mysql://mysql:3306/family_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      FAMILY_AI_DB_USERNAME: family_app
      FAMILY_AI_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      FAMILY_AI_ENABLED: ${FAMILY_AI_ENABLED:-false}
      FAMILY_AI_API_KEY: ${FAMILY_AI_API_KEY:-}
      FAMILY_AI_CONTENT_URL: http://family-content-svc:8082
      FAMILY_AI_FILE_URL: http://family-file-svc:8087
      FAMILY_AI_ARCHIVE_URL: http://family-archive-svc:8088
      FAMILY_AI_USER_URL: http://family-user-svc:8081
    depends_on:
      - nacos
      - mysql
      - family-user-svc
      - family-content-svc
      - family-file-svc
      - family-archive-svc

  family-iot-svc:
    build:
      context: ..
      dockerfile: backend/family-iot-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: family_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      # 设备访问令牌用 AES 加密入库；留空时服务能启动，但保存设备会失败
      FAMILY_IOT_ENCRYPTION_KEY: ${FAMILY_IOT_ENCRYPTION_KEY:-}
    depends_on:
      - nacos
      - mysql
      - family-user-svc

  family-ledger-svc:
    build:
      context: ..
      dockerfile: backend/family-ledger-svc/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: nacos:8848
      FAMILY_LEDGER_DB_URL: jdbc:mysql://mysql:3306/family_ledger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      FAMILY_LEDGER_DB_USERNAME: family_app
      FAMILY_LEDGER_DB_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      FAMILY_JWT_SECRET: ${FAMILY_JWT_SECRET:?}
      FAMILY_USER_URL: http://family-user-svc:8081
    depends_on:
      - nacos
      - mysql
      - family-user-svc

  # NAT 穿透兜底。P2P 直连失败（对称型 NAT、移动网络）时媒体经 TURN 中继。
  # 使用 host 网络：UDP 中继端口段无法用 docker 端口映射高效覆盖，宿主即 coturn 所在机。
  coturn:
    image: coturn/coturn:4.6.2-alpine
    network_mode: host
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${FAMILY_TURN_SECRET:?请在 .env 中配置 TURN 静态密钥}"
      - "--realm=${FAMILY_TURN_REALM:-family.home}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-cli"
      - "--no-multicast-peers"
      # 公网部署必须显式声明外网地址，否则返回的 relay 候选不可达：--external-ip=<公网IP>


  # LiveKit SFU：8 人以上多人通话的媒体服务器（隐私可控、媒体经自建节点）。
  # 使用 host 网络：WebRTC 的 UDP 媒体端口段无法用 docker 端口映射高效覆盖。
  # 公网部署务必在 livekit.yaml 配置 external_ip 或 use_external_ip，并在防火墙放行 50100-50200/udp。
  livekit:
    # 起步用 latest 便于拉到可用版本；生产上线前锁定到验证过的具体 tag（docker pull 后记录 digest）
    image: livekit/livekit-server:latest
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml --bind 0.0.0.0

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
      - family-gateway
      - family-user-svc
      - family-content-svc
      - family-file-svc
      - family-archive-svc
      - family-im-svc
      - family-media-svc
      - family-ai-svc
      - family-iot-svc
      - family-ledger-svc

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/family-platform-overview.json:/var/lib/grafana/dashboards/family-platform-overview.json:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
  file-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  rabbitmq-data:

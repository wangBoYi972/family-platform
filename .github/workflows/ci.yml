name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Strict verify (enforcer + architecture + integration tests)
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/archunit-reports
          if-no-files-found: ignore

  frontend:
    name: Admin web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/admin-web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: apps/admin-web/dist
          if-no-files-found: error

  # 依赖漏洞扫描为独立步骤，失败不阻断主流程（结果以 artifact 供人工核验）。
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency-check
        run: mvn -B -ntp -f backend/pom.xml verify -Pscan -DskipTests
        continue-on-error: true
      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: backend/**/target/dependency-check-report.html
          if-no-files-found: ignore

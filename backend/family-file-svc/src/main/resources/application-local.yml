server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_file?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    # 历史表由手工 SQL 建，没有迁移记录，直接开启会因「表已存在」失败。
    # baseline 到 V2（当前结构已达版本），后续 V3+ 由 Flyway 自动执行。
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
  rabbitmq:
    username: guest
    password: guest
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  clients:
    user-url: http://127.0.0.1:8081
    file-url: http://127.0.0.1:8087
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

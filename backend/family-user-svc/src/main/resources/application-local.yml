server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    enabled: false
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  clients:
    user-url: http://127.0.0.1:8081
    file-url: http://127.0.0.1:8087
  auth:
    mock-login-enabled: true
    mock-code: ${FAMILY_AUTH_MOCK_CODE:888888}
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

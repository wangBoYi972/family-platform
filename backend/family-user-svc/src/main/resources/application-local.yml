server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    # V4 曾以 success=0 落库，启动会直接抛「Detected failed migration」；
    # 历史已修正，保持开启以便后续版本自动执行。
    enabled: true
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  clients:
    user-url: http://127.0.0.1:8081
    file-url: http://127.0.0.1:8087
  auth:
    mock-login-enabled: true
    mock-code: ${FAMILY_AUTH_MOCK_CODE:888888}
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
    # 本地常无 Redis；允许限流降级，避免 mock 登录 503
    login-rate-limit-failopen: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: 8091
spring:
  application:
    name: family-ai-svc
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${FAMILY_AI_DB_URL:jdbc:mysql://127.0.0.1:3306/family_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${FAMILY_AI_DB_USERNAME:family_app}
    password: ${FAMILY_AI_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: AiHikariPool
  flyway:
    enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
family:
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:}
  # Feign 直连下游。空 url 会让上下文起不来，生产用同一组环境变量覆盖成内网地址。
  clients:
    user-url: ${FAMILY_AI_USER_URL:http://127.0.0.1:8081}
    content-url: ${FAMILY_AI_CONTENT_URL:http://127.0.0.1:8082}
    file-url: ${FAMILY_AI_FILE_URL:http://127.0.0.1:8087}
    archive-url: ${FAMILY_AI_ARCHIVE_URL:http://127.0.0.1:8088}
  ai:
    # key 只从环境变量注入（FAMILY_AI_API_KEY），绝不写进仓库。
    # enabled=false 时 /api/ai/chat 返回 503，前端按「AI 未配置」提示。
    enabled: ${FAMILY_AI_ENABLED:false}
    api-key: ${FAMILY_AI_API_KEY:}
    base-url: ${FAMILY_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${FAMILY_AI_MODEL:qwen-plus}
    # 通话录音转写模型：走 OpenAI 兼容 chat/completions 的 input_audio（支持 base64，不需要公网 URL）
    asr-model: ${FAMILY_AI_ASR_MODEL:qwen3-asr-flash}
    max-tool-rounds: ${FAMILY_AI_MAX_TOOL_ROUNDS:3}
    content-url: ${FAMILY_AI_CONTENT_URL:http://127.0.0.1:8082}
    file-url: ${FAMILY_AI_FILE_URL:http://127.0.0.1:8087}
    archive-url: ${FAMILY_AI_ARCHIVE_URL:http://127.0.0.1:8088}
    user-url: ${FAMILY_AI_USER_URL:http://127.0.0.1:8081}
    # 管理端保存的 key/开关落盘位置（已被 .gitignore 覆盖）；删除该文件即恢复环境变量
    config-file: ${FAMILY_AI_CONFIG_FILE:.local/ai-settings.json}
springdoc:
  api-docs:
    enabled: ${FAMILY_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${FAMILY_DOCS_ENABLED:false}

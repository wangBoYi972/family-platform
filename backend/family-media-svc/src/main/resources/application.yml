server:
  port: 8090
spring:
  application:
    name: family-media-svc
  datasource:
    url: ${FAMILY_MEDIA_DB_URL:jdbc:mysql://127.0.0.1:3306/family_media?serverTimezone=Asia/Shanghai}
    username: ${FAMILY_MEDIA_DB_USERNAME:family_app}
    password: ${FAMILY_MEDIA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: MediaHikariPool
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
springdoc:
  api-docs:
    enabled: ${FAMILY_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${FAMILY_DOCS_ENABLED:false}
family:
  clients:
    # 录音转写与纪要生成在下游 AI 服务；生产可用环境变量指到内网地址
    ai-url: ${FAMILY_MEDIA_AI_URL:http://127.0.0.1:8091}
  # 开启后 WebSocket 票据与信令跨实例广播走 Redis；多副本部署必须开启。
  messaging:
    enabled: ${FAMILY_MESSAGING_ENABLED:false}
    # 已发布事件的保留天数，超期由 OutboxPublisher 定时清理
    retention-days: ${FAMILY_MESSAGING_RETENTION_DAYS:7}
  media:
    max-participants: ${FAMILY_MEDIA_MAX_PARTICIPANTS:8}
    ring-timeout-seconds: ${FAMILY_MEDIA_RING_TIMEOUT_SECONDS:45}
    reconnect-grace-seconds: ${FAMILY_MEDIA_RECONNECT_GRACE_SECONDS:30}
    verify-members: ${FAMILY_MEDIA_VERIFY_MEMBERS:true}
    turn:
      # coturn 的 static-auth-secret；留空则只下发 STUN。
      secret: ${FAMILY_TURN_SECRET:}
      ttl-seconds: ${FAMILY_TURN_TTL_SECONDS:3600}
      urls: ${FAMILY_TURN_URLS:turn:127.0.0.1:3478?transport=udp,turn:127.0.0.1:3478?transport=tcp}
      stun-urls: ${FAMILY_STUN_URLS:stun:127.0.0.1:3478}
  # LiveKit SFU。默认关闭 -> 完全保持原 mesh 行为；开启前必须配齐三项凭据。
  livekit:
    enabled: ${FAMILY_LIVEKIT_ENABLED:false}
    api-key: ${LIVEKIT_API_KEY:}
    # HS256 签名要求 >= 32 字节；生产用 openssl rand -hex 32 生成，且与 livekit.yaml 一致。
    api-secret: ${LIVEKIT_API_SECRET:}
    # 浏览器连接的 WSS 地址（由 Nginx/Caddy 终止 TLS 后反代到 7880）。
    public-url: ${LIVEKIT_PUBLIC_URL:}
    internal-url: ${LIVEKIT_INTERNAL_URL:http://127.0.0.1:7880}
    room-prefix: ${LIVEKIT_ROOM_PREFIX:family-}
    token-ttl-seconds: ${LIVEKIT_TOKEN_TTL_SECONDS:3600}
    max-participants: ${LIVEKIT_MAX_PARTICIPANTS:20}


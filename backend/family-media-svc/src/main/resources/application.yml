server:
  port: 8090
spring:
  application:
    name: family-media-svc
  datasource:
    url: ${FAMILY_MEDIA_DB_URL:jdbc:mysql://127.0.0.1:3306/family_media?serverTimezone=Asia/Shanghai}
    username: ${FAMILY_MEDIA_DB_USERNAME:family_app}
    password: ${FAMILY_MEDIA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: MediaHikariPool
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
springdoc:
  api-docs:
    enabled: ${FAMILY_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${FAMILY_DOCS_ENABLED:false}

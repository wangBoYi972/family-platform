server:
  address: 127.0.0.1
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: family-user-local
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: family-content-local
          uri: http://127.0.0.1:8082
          predicates:
            - Path=/api/tasks/**,/api/notices/**,/api/calendar/**,/api/dynamics/**,/api/albums/**
        - id: family-file-local
          uri: http://127.0.0.1:8087
          predicates:
            - Path=/api/files/**
        - id: family-archive-local
          uri: http://127.0.0.1:8088
          predicates:
            - Path=/api/archives/**
        - id: family-im-local
          uri: http://127.0.0.1:8089
          predicates:
            - Path=/api/im/**
        - id: family-media-local
          uri: http://127.0.0.1:8090
          predicates:
            - Path=/api/media/**
        - id: family-im-ws-local
          uri: ws://127.0.0.1:8089
          predicates:
            - Path=/ws/im
        - id: family-media-ws-local
          uri: ws://127.0.0.1:8090
          predicates:
            - Path=/ws/call
family:
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
  gateway:
    # 本地 H5（5173）与网关（8080）不同源，需显式放行；生产由 Nginx 同源代理，保持关闭。
    cors:
      enabled: ${FAMILY_GATEWAY_CORS_ENABLED:true}
      allowed-origins: ${FAMILY_GATEWAY_CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_archive?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    # 本地库与生产保持同一套迁移脚本：V1 已记录在 flyway_schema_history，
    # 关闭 Flyway 会让新增的 V2（用药/复诊）永远建不出来，接口直接 500。
    enabled: true
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  clients:
    user-url: http://127.0.0.1:8081
    file-url: http://127.0.0.1:8087
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
  # 本地开发专用档案密钥:32 字节固定值的 Base64,缺失时 archive 服务启动即失败。
  # 仅用于 .local 下的 H2 库；生产由 FAMILY_ARCHIVE_KEY 环境变量注入（见 infra/docker-compose.yml）。
  # 注意：密钥一旦用于真实数据就不能更换，否则历史档案将无法解密。
  archive:
    key: ${FAMILY_ARCHIVE_KEY:ZGV2LW9ubHktZmFtaWx5LWFyY2hpdmUta2V5LTMyYnk=}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

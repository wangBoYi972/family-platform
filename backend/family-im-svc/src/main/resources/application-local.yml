server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_im?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    # 同 file-svc：结构已与 V1-V3 一致但没有迁移记录，baseline 到 V3 后由 Flyway 接管
    enabled: true
    baseline-on-migrate: true
    baseline-version: 3
  rabbitmq:
    username: guest
    password: guest
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  clients:
    user-url: http://127.0.0.1:8081
    file-url: http://127.0.0.1:8087
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

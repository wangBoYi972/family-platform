mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
server:
  port: 8082
spring:
  application:
    name: family-content-svc
  datasource:
    url: ${FAMILY_CONTENT_DB_URL:jdbc:mysql://127.0.0.1:3306/family_content?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${FAMILY_CONTENT_DB_USERNAME:family_app}
    password: ${FAMILY_CONTENT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ContentHikariPool
  flyway:
    enabled: true
    table: flyway_schema_history_content
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:family}
    password: ${RABBITMQ_PASSWORD:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
springdoc:
  api-docs:
    enabled: ${FAMILY_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${FAMILY_DOCS_ENABLED:false}
family:
  messaging:
    enabled: ${FAMILY_MESSAGING_ENABLED:false}
    service-name: family-content-svc
    exchange: family.events

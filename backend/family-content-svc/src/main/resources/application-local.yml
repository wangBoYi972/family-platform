server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_content?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    # 本地库与生产共用同一套迁移脚本：关掉会让新增版本（V5 提醒记录表）永远建不出来，
    # 对应接口只在运行时才 500，启动阶段毫无提示。
    enabled: true
  rabbitmq:
    username: guest
    password: guest
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  clients:
    user-url: http://127.0.0.1:8081
    file-url: http://127.0.0.1:8087
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

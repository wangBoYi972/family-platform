server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_ledger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    enabled: true
    table: flyway_schema_history_ledger
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
  clients:
    user-url: http://127.0.0.1:8081
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

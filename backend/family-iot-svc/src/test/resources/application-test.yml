server:
  port: 0
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
family:
  auth:
    jwt-secret: test-secret-32-characters-minimum
  iot:
    ws-timeout: 5
    command-timeout: 3
    encryption-key: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1jaGFyYWN0ZXJz

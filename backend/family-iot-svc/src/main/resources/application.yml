server:
  port: 8092
spring:
  application:
    name: family-iot-svc
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/family_iot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
family:
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:}
  iot:
    # WebSocket 连接超时（秒）
    ws-timeout: ${FAMILY_IOT_WS_TIMEOUT:10}
    # 命令执行超时（秒）
    command-timeout: ${FAMILY_IOT_COMMAND_TIMEOUT:5}
    # 远程中枢白名单（逗号分隔的主机名，精确匹配）。
    # 默认只允许私网地址防 SSRF；不在家要控制设备时，把 Tailscale 域名 / HA Cloud 域名 / 内网穿透域名填进来。
    # 例：abc123.ts.net,myhome.ui.nabu.casa
    allowed-hosts: ${FAMILY_IOT_ALLOWED_HOSTS:}
    # 后台静默发现中枢：地址与令牌由服务端底层自动获取并封装，绝不经过 UI。
    # 生产环境可替换为 mDNS/SSDP 局域网发现模块（JmDNS / HA zeroconf）写入这两个值。
    # 留空时前端提示"请检查中枢是否通电/连接同一WiFi"并提供重新扫描。
    auto-hub-url: ${FAMILY_IOT_AUTO_HUB_URL:}
    auto-hub-token: ${FAMILY_IOT_AUTO_HUB_TOKEN:}
    # 加密密钥（从环境变量读取，本地开发环境需设置）
    encryption-key: ${FAMILY_IOT_ENCRYPTION_KEY:}
    # 云端直连（推荐落地，无需 Home Assistant）
    # provider=sim 仅联调；正式环境改为 tuya 并配置下面三个密钥
    cloud:
      provider: ${FAMILY_IOT_CLOUD_PROVIDER:sim}
      tuya:
        base-url: ${FAMILY_IOT_TUYA_BASE_URL:https://openapi.tuyacn.com}
        access-id: ${FAMILY_IOT_TUYA_ACCESS_ID:}
        access-secret: ${FAMILY_IOT_TUYA_ACCESS_SECRET:}
        uid: ${FAMILY_IOT_TUYA_UID:}

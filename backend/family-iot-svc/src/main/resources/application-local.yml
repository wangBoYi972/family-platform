server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/family_iot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  flyway:
    enabled: true
  cloud:
    nacos:
      discovery:
        enabled: false
family:
  # 本地不走注册中心，服务间身份校验直连 user-svc；缺这段 Feign 会解析不到
  # family-user-svc，所有 /api/iot/** 都会返回「身份服务验证失败」。
  clients:
    user-url: http://127.0.0.1:8081
  auth:
    jwt-secret: ${FAMILY_JWT_SECRET:local-development-secret-32-characters-min}
  iot:
    ws-timeout: 10
    command-timeout: 5
    # 本地开发环境固定密钥，生产必须从环境变量读取。
    # 注意：TokenEncryptor 按 Base64 解码，明文串会在启动时报 Illegal base64 character；
    # 这里给的是 "family-iot-local-dev-key-32bytes" 的 Base64。
    encryption-key: ${FAMILY_IOT_ENCRYPTION_KEY:ZmFtaWx5LWlvdC1sb2NhbC1kZXYta2V5LTMyYnl0ZXM=}

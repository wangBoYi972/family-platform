<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · 家庭综合平台</title>
  <script>
    // GitHub Pages 会在访问者原来的地址上返回这份 404.html。
    // 相对链接会跟着丢失的路径走，所以先把基准钉在站点根上。
    (function () {
      var root = "/";
      if (/(^|\.)github\.io$/i.test(location.hostname)) {
        var repo = (location.pathname.split("/").filter(Boolean)[0] || "");
        if (/^[A-Za-z0-9._-]+$/.test(repo)) root = "/" + repo + "/";
      }
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main class="missing">
    <div>
      <p class="kicker">404</p>
      <h1>这一页不在册子里</h1>
      <p>介绍站只有首页。设计笔记留在仓库中，不从这里发布。</p>
      <p><a class="button" href="./">回到家庭综合平台</a></p>
    </div>
  </main>
</body>
</html>

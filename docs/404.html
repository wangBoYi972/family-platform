<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面不存在 · 家庭综合平台</title>
  <script>
    // GitHub Pages 会在访问者原来的地址上返回这份 404.html。
    // 相对链接会跟着丢失的路径走，所以先把基准钉在站点根上。
    (function () {
      var root = "/";
      if (/(^|\.)github\.io$/i.test(location.hostname)) {
        var repo = (location.pathname.split("/").filter(Boolean)[0] || "");
        if (/^[A-Za-z0-9._-]+$/.test(repo)) root = "/" + repo + "/";
      }
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>

          <path d="M11.4 23.2 C 11.45 20.9, 11.5 18.7, 11.6 16.6 C 12.9 15.9, 15 15.9, 16.3 16.6 C 16.4 18.7, 16.45 20.9, 16.5 23.2" />
          <circle cx="15.15" cy="19.4" r="0.5" fill="currentColor" stroke="none" />
